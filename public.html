<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>VespaTrek — Live Map</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --brand: #2196F3;
      --accent: #ff9800;
      --yt: #ff0000;
      --fuel: #4caf50;
      --maint: #9c27b0;
      --carb: #00bcd4;
    }

    * { box-sizing: border-box; }
   



       html {
      height: 100%;
    }
    body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      height: 100dvh; /* Usa tutta l'altezza reale dello schermo anche su mobile */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }


    
    /* ===== HEADER E CONTROLLI ===== */
    #topBar {
      position: relative; /* Non fluttua più, occupa il suo spazio reale */
      width: 100%;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }



    

    .header-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

   .top-controls {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-top: 5px;
}

select.btn-filter {
background: #333;
color: #fff;
border: 1px solid #555;
padding: 10px;
border-radius: 8px;
font-size: 14px;
font-weight: bold;
width: 100%;
outline: none;
}

button.btn-filter {
background: var(--accent);
color: #000;
border: none;
padding: 10px;
border-radius: 8px;
font-size: 14px;
font-weight: bold;
cursor: pointer;
grid-column: span 2;
}

      /* ===== MAPPA ===== */
    #mapPub {
      flex: 1 1 auto; /* Si espande e si restringe fluidamente */
      width: 100%;
      height: 100%; /* Obbliga la mappa ad aprirsi del tutto */
      min-height: 0; /* Previene un bug dei browser sullo scorrimento */
      z-index: 1;
    }}

    /* ===== MARKERS PERSONALIZZATI ===== */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px !important;
      height: 34px !important;
      border-radius: 50%;
      font-size: 18px;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      margin-left: -17px !important;
      margin-top: -17px !important;
      color: #fff;
      z-index: 1000 !important;
    }
    .marker-foto { background: var(--accent); }
    .marker-video { background: var(--yt); font-size: 14px; }
    .marker-maint { background: var(--maint); }
    .marker-fuel  { background: var(--fuel); }
    .marker-carb  { background: var(--carb); }

    /* ===== POPUP LEAFLET ===== */
    .leaflet-popup-content-wrapper {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .leaflet-popup-tip { background: var(--card); border: 1px solid var(--border); }
    .popup-title { font-weight: 900; color: var(--accent); margin-bottom: 5px; font-size: 16px; }
    .popup-meta { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .popup-img { width: 100%; border-radius: 8px; margin-top: 8px; cursor: pointer; }
    .popup-video iframe { width: 100%; height: 160px; border-radius: 8px; margin-top: 8px; border:none; }

    /* ===== LIGHTBOX FOTO ===== */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 9999;
      align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }
    #lightboxClose {
      position: absolute; top: 15px; right: 15px;
      background: #f44336; color: #fff; border: none;
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 20px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- HEADER & FILTRI -->
  <div id="topBar">
    <div class="header-title">
      <span id="appTitle">VespaTrek Live 🌍</span>
      <span id="statsMini" style="font-size:12px; color:#aaa; font-weight:normal;">Caricamento...</span>
    </div>
    
    <div class="top-controls">
      <!-- Tracce -->
      <select class="btn-filter" onchange="setMode(this.value)">
        <option value="TUTTO">🛣️ Tutte le tracce</option>
        <option value="TAPPE">🏁 Solo Tappe</option>
        <option value="GIRI">🛵 Solo Giri</option>
      </select>
      
      <!-- Paese Mappa -->
      <select id="selectCountry" class="btn-filter" onchange="setCountry(this.value)">
        <option value="">🌎 Globale</option>
      </select>

      <!-- Markers -->
      <select class="btn-filter" onchange="setMarkerFilter(this.value)">
        <option value="ALL">📍 Tutti i Marker</option>
        <option value="FOTO">📷 Foto</option>
        <option value="VIDEO">▶️ Video</option>
        <option value="MAINT">🔧 Officina</option>
        <option value="FUEL">⛽ Rifornimenti</option>
        <option value="CARB">🌬️ Carburazione</option>
      </select>

      <!-- Bottone Statistiche -->
      <button class="btn-filter" onclick="apriStats()">📊 Statistiche</button>
    </div>
  </div>

  <!-- MAPPA -->
  <div id="mapPub"></div>



  <!-- MODALE STATISTICHE -->
  <div id="statsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:8000; align-items:center; justify-content:center; padding:15px;">
    <div style="background:var(--card); width:100%; max-width:500px; border-radius:15px; border:2px solid var(--accent); padding:20px; position:relative; max-height: 90vh; overflow-y: auto;">
      <button onclick="document.getElementById('statsModal').style.display='none'" style="position:absolute; top:10px; right:10px; background:#f44336; color:#fff; border:none; border-radius:50%; width:30px; height:30px; font-weight:bold; cursor:pointer;">×</button>
      <h2 style="color:var(--accent); margin-top:0; text-align:center;">📊 Statistiche</h2>

      <!-- Filtro Paese dentro le Stats -->
      <select id="statsCountryFilter" class="btn-filter" style="margin-bottom:15px;" onchange="renderStatsDati()">
        <option value="GLOBAL">🌎 Globali</option>
      </select>

      <div id="statsModalContent" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; text-align:center;">
      </div>
    </div>
  </div>


  
  <div id="mapPub"></div>


  <!-- MODALE STATISTICHE -->
  <div id="statsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:8000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:var(--card); width:100%; max-width:500px; border-radius:15px; border:2px solid var(--accent); padding:20px; position:relative;">
      <button onclick="document.getElementById('statsModal').style.display='none'" style="position:absolute; top:10px; right:10px; background:#f44336; color:#fff; border:none; border-radius:50%; width:30px; height:30px; font-weight:bold; cursor:pointer;">×</button>
      <h2 style="color:var(--accent); margin-top:0; text-align:center;">📊 Statistiche Viaggio</h2>
      <div id="statsModalContent" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:center;"></div>
    </div>
  </div>

  
  <!-- LIGHTBOX FOTO -->
  <div id="lightbox" onclick="closeLightbox()">
    <button id="lightboxClose" onclick="event.stopPropagation(); closeLightbox()">×</button>
    <img id="lightboxImg" onclick="event.stopPropagation();">
  </div>

<script>
  let DATA = null;
  let map = null;
  let layerTracce = null;
  let layerMarkers = null;

  let currentMode = 'TUTTO'; // TUTTO, TAPPE, GIRI
  let currentCountry = '';   // vuoto = Mondo
  let currentMarkerFilter = 'ALL'; // ALL, FOTO, VIDEO, MAINT, FUEL, CARB

  // Inizializza Mappa
  function initMap() {
    map = L.map('mapPub', { zoomControl: false }).setView([4.7, -74.1], 5);
       L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    layerTracce = L.layerGroup().addTo(map);
    layerMarkers = L.layerGroup().addTo(map);
  }

  // Estrai ID Youtube
  function getYouTubeId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  // Prepara Icone
  const iconFoto = L.divIcon({ className: 'custom-marker marker-foto', html: '📷' });
  const iconVideo = L.divIcon({ className: 'custom-marker marker-video', html: '▶️' });
  const iconMaint = L.divIcon({ className: 'custom-marker marker-maint', html: '🔧' });
  const iconFuel = L.divIcon({ className: 'custom-marker marker-fuel', html: '⛽' });
  const iconCarb = L.divIcon({ className: 'custom-marker marker-carb', html: '🌬️' });

  // Disegna Tracce e Marcatori
  function renderMap() {
    layerTracce.clearLayers();
    layerMarkers.clearLayers();

    if (!DATA) return;

    let bounds = L.latLngBounds();
    let drawnLines = 0;

    // 1. DISEGNA TRACCE (Tappe e Turismo)
    const tappe = Array.isArray(DATA.tappe) ? DATA.tappe : [];
    const turismo = Array.isArray(DATA.turismo) ? DATA.turismo : [];

    let tracceDaMostrare = [];
    if (currentMode === 'TUTTO' || currentMode === 'TAPPE') tracceDaMostrare.push(...tappe);
    if (currentMode === 'TUTTO' || currentMode === 'GIRI') tracceDaMostrare.push(...turismo);

    tracceDaMostrare.forEach(t => {
      if (currentCountry && t.paese !== currentCountry) return;
      if (!t.traccia || t.traccia.length < 2) return;

      const latlngs = t.traccia.map(p => Array.isArray(p) ? [p[0], p[1]] : [p.lat, p.lon || p.lng]);
      const color = t.tipo === 'Turismo' ? '#2196F3' : '#d32f2f';

      // Linea visibile
      const poly = L.polyline(latlngs, { color: color, weight: 4, opacity: 0.8, interactive: false }).addTo(layerTracce);
      
      // Linea spessa e invisibile sopra quella vera, fa da "calamita" per il dito sul telefono!
      const clickPoly = L.polyline(latlngs, { color: 'transparent', weight: 30, opacity: 0.01 }).addTo(layerTracce);
      bounds.extend(poly.getBounds());
      drawnLines++;

      // Calcolo ore e consumo
      const h = Math.floor((t.durata || 0) / 3600);
      const m = Math.floor(((t.durata || 0) % 3600) / 60);
      const consHtml = (t.benzinaStimataLitri > 0) ? `<div>⛽ Consumo: <b>${(t.km / t.benzinaStimataLitri).toFixed(1)} km/L</b></div>` : '';

      const infoEstesa = `
        <div class="popup-title">${t.tipo === 'Turismo' ? '🛵' : '🏁'} ${t.tipo || 'Percorso'} - ${t.paese}</div>
        <div class="popup-meta">📅 ${t.data} ${t.ora || ''} | 📏 <b>${t.km} km</b></div>
        <div style="font-size:13px; margin-bottom:8px; line-height:1.4;">
          <div>⏱️ Tempo: ${h}h ${m}m</div>
          <div>⛰️ Altitudine: ${t.altMin || 0}m → ${t.altMax || 0}m</div>
          <div>🏎️ Vel. Max: ${t.velMax || 0} km/h ${t.velMedia ? `(Media: ${t.velMedia})` : ''}</div>
          ${consHtml}
        </div>
        ${t.titolo ? `<div style="font-weight:bold; margin-bottom:4px; color:var(--accent);">📍 ${t.titolo}</div>` : ''}
        ${t.note ? `<div style="color:#bbb; font-style:italic;">${t.note}</div>` : ''}
      `;

      clickPoly.bindPopup(infoEstesa);

      // Aggiunge un marker a bandierina alla fine della tappa, facilissimo da cliccare
      const lastPoint = latlngs[latlngs.length - 1];
      const markerFine = L.marker(lastPoint, { 
        icon: L.divIcon({ className: 'custom-marker', html: t.tipo === 'Turismo' ? '🛵' : '🏁', iconSize:[30,30] }) 
      }).addTo(layerTracce);
      markerFine.bindPopup(infoEstesa);
    });

    // --- FUNZIONE SUPPORTO MARKER ---
    function creaMarker(lat, lon, icona, popupHTML) {
      if (!isFinite(lat) || !isFinite(lon)) return;
      const m = L.marker([lat, lon], { icon: icona }).addTo(layerMarkers);
      bounds.extend(m.getLatLng());
      m.bindPopup(popupHTML, { minWidth: 250 });
    }

    // 2. DISEGNA DIARIO (Foto e Video)
    const diario = Array.isArray(DATA.diario) ? DATA.diario : [];
    diario.forEach(d => {
      if (currentCountry && d.paese !== currentCountry) return;
      if (!d.geo) return;

      const ytId = getYouTubeId(d.videoUrl);
      const fotoSrc = d.fotoUrl || d.foto;
      
      const tipoMedia = ytId ? 'VIDEO' : 'FOTO';
      // Applica il filtro Marker!
      if (currentMarkerFilter !== 'ALL' && currentMarkerFilter !== tipoMedia) return;

      let mediaHtml = '';
      if (ytId) {
        mediaHtml = `<div class="popup-video"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>`;
      } else if (fotoSrc) {
        mediaHtml = `<img class="popup-img" src="${fotoSrc}" onclick="openLightbox('${fotoSrc}')">`;
      }

      creaMarker(d.geo.lat, d.geo.lon, ytId ? iconVideo : iconFoto, `
        <div class="popup-title">📍 ${d.paese || ''}</div>
        <div class="popup-meta">📅 ${d.data} ${d.ora} | 📏 km ${d.km}</div>
        <div>${d.testo || ''}</div>
        ${mediaHtml}
      `);
    });

    // 3. DISEGNA OFFICINA
    const manutenzioni = Array.isArray(DATA.manutenzioni) ? DATA.manutenzioni : [];
    manutenzioni.forEach(m => {
      if (currentCountry && m.paese !== currentCountry) return;
      if (!m.geo) return;
      // Applica il filtro Marker!
      if (currentMarkerFilter !== 'ALL' && currentMarkerFilter !== 'MAINT') return;

      creaMarker(m.geo.lat, m.geo.lon, iconMaint, `
        <div class="popup-title" style="color:var(--maint)">🔧 Officina: ${m.nome}</div>
        <div class="popup-meta">📅 ${m.data} | 📏 km ${m.km}</div>
        <div>${m.desc || ''}</div>
        ${m.costoUsd > 0 ? `<div style="margin-top:5px; color:#4caf50;">💰 Costo: 
$$
{m.costoUsd.toFixed(2)}</div>` : ''}
      `);
    });

    // 4. DISEGNA RIFORNIMENTI
    const rifornimenti = Array.isArray(DATA.rifornimenti) ? DATA.rifornimenti : [];
    rifornimenti.forEach(r => {
      if (currentCountry && r.paese !== currentCountry) return;
      if (!r.geo) return;
      // Applica il filtro Marker!
      if (currentMarkerFilter !== 'ALL' && currentMarkerFilter !== 'FUEL') return;

      creaMarker(r.geo.lat, r.geo.lon, iconFuel, `
        <div class="popup-title" style="color:var(--fuel)">⛽ Rifornimento</div>
        <div class="popup-meta">📅 ${r.data} | 📏 km ${r.km}</div>
        <div>📦 <b>${r.qta} L</b> (Destinazione: ${r.dest})</div>
        ${r.costoBenzUsd > 0 ? `<div style="margin-top:5px; color:#4caf50;">💰 Pagato:
$$
{Number(r.costoBenzUsd).toFixed(2)}</div>` : ''}
      `);
    });

    // 5. DISEGNA CARBURAZIONI
    const carburazioni = Array.isArray(DATA.carburazioni) ? DATA.carburazioni : [];
    carburazioni.forEach(c => {
      if (!c.geo) return;
      // Applica il filtro Marker!
      if (currentMarkerFilter !== 'ALL' && currentMarkerFilter !== 'CARB') return;

      creaMarker(c.geo.lat, c.geo.lon, iconCarb, `
        <div class="popup-title" style="color:var(--carb)">🌬️ Setup Carburatore</div>
        <div class="popup-meta">📅 ${c.data} | ⛰️ Altitudine: ${c.alt}m</div>
        <div>Max: <b>${c.chicMax}</b> | Min: <b>${c.chicMin}</b></div>
        ${c.nota ? `<div style="margin-top:5px; font-style:italic;">"${c.nota}"</div>` : ''}
      `);
    });

    // Adatta la vista
    if (drawnLines > 0 || layerMarkers.getLayers().length > 0) {
      map.fitBounds(bounds.pad(0.1));
    }
  }

  // Gestione Bottoni Filtro Tracce
   // Funzioni per le Tendine (Dropdown)
  function setMode(mode) {
    currentMode = mode;
    renderMap();
  }

  function setCountry(country) {
    currentCountry = country;
    renderMap();
  }

  function setMarkerFilter(filterType) {
    currentMarkerFilter = filterType;
    renderMap();
  }

  // Popola ENTRAMBE le tendine dei paesi (Mappa e Statistiche)
  function popolaPaesi() {
    const selectMap = document.getElementById('selectCountry');
    const selectStats = document.getElementById('statsCountryFilter');
    if (!DATA || !DATA.datiPaesi) return;
    
    Object.keys(DATA.datiPaesi).sort().forEach(p => {
      const optMap = document.createElement('option');
      optMap.value = p;
      optMap.innerText = "📍 " + p;
      selectMap.appendChild(optMap);

      const optStats = document.createElement('option');
      optStats.value = p;
      optStats.innerText = "📍 " + p;
      selectStats.appendChild(optStats);
    });
  }

  // LOGICA STATISTICHE
  function apriStats() {
    document.getElementById('statsModal').style.display = 'flex';
    document.getElementById('statsCountryFilter').value = 'GLOBAL';
    renderStatsDati();
  }

  function renderStatsDati() {
    if (!DATA) return;
    const mode = document.getElementById('statsCountryFilter').value;
    
    let km = 0, benz = 0, spesaBenz = 0, spesaMaint = 0;

    if (mode === 'GLOBAL') {
      const s = DATA.stats;
      km = s.kmTotali || 0;
      benz = s.benzinaUsataLitri || 0;
      spesaBenz = s.spesaBenzinaUsd || 0;
      spesaMaint = (s.spesaRicambiUsd || 0) + (s.spesaManodoperaUsd || 0);
    } else {
      const dp = DATA.datiPaesi[mode] || {};
      km = dp.km || 0;
      benz = (dp.benzina || 0) + (dp.benzinaFuori || 0);
      spesaBenz = dp.spesaBenzinaUsd || 0;
      spesaMaint = (dp.spesaRicambiUsd || 0) + (dp.spesaManodoperaUsd || 0);
    }

    const cons = benz > 0 ? (km / benz).toFixed(1) : '--';

    document.getElementById('statsModalContent').innerHTML = `
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:11px; color:#aaa;">KM TOTALI</div>
        <div style="font-size:18px; color:#4caf50; font-weight:bold;">${km.toFixed(1)}</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:11px; color:#aaa;">BENZINA USATA</div>
        <div style="font-size:18px; color:#ff9800; font-weight:bold;">${benz.toFixed(1)} L</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:11px; color:#aaa;">SPESA BENZINA</div>
        <div style="font-size:18px; color:#fff; font-weight:bold;">
$$
{spesaBenz.toFixed(2)}</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:11px; color:#aaa;">SPESA OFFICINA</div>
        <div style="font-size:18px; color:var(--maint); font-weight:bold;">
$$
{spesaMaint.toFixed(2)}</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px; grid-column: 1 / -1;">
        <div style="font-size:11px; color:#aaa;">CONSUMO MEDIO</div>
        <div style="font-size:20px; color:var(--brand); font-weight:bold;">${cons} km/L</div>
      </div>
    `;
  }

  // Lightbox Foto
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightboxImg').src = '';
  }


  function apriStats() {
    if (!DATA || !DATA.stats) return;
    const s = DATA.stats;
    const cons = s.benzinaUsataLitri > 0 ? (s.kmTotali / s.benzinaUsataLitri).toFixed(1) : '--';
    const box = document.getElementById('statsModalContent');
    box.innerHTML = `
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:12px; color:#aaa;">KM TOTALI</div>
        <div style="font-size:20px; color:#4caf50; font-weight:bold;">${s.kmTotali.toFixed(1)}</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:12px; color:#aaa;">BENZINA USATA</div>
        <div style="font-size:20px; color:#ff9800; font-weight:bold;">${s.benzinaUsataLitri.toFixed(1)} L</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:12px; color:#aaa;">OLIO 2T USATO</div>
        <div style="font-size:20px; color:#00bcd4; font-weight:bold;">${s.olioTotaleLitri.toFixed(2)} L</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:12px; color:#aaa;">SPESA BENZINA</div>
        <div style="font-size:20px; color:#fff; font-weight:bold;">
$$
{s.spesaBenzinaUsd.toFixed(2)}</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:12px; color:#aaa;">SPESA OFFICINA</div>
        <div style="font-size:20px; color:var(--maint); font-weight:bold;">
$$
{(s.spesaRicambiUsd + s.spesaManodoperaUsd).toFixed(2)}</div>
      </div>
      <div style="background:#333; padding:10px; border-radius:10px;">
        <div style="font-size:12px; color:#aaa;">CONSUMO MEDIO</div>
        <div style="font-size:20px; color:var(--brand); font-weight:bold;">${cons} km/L</div>
      </div>
    `;
    document.getElementById('statsModal').style.display = 'flex';
  }

  
  // Caricamento Dati
  async function loadData() {
    initMap();
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const src = urlParams.get('src') || 'vespatrek_public.json';
      
      const res = await fetch(src);
      DATA = await res.json();

      document.getElementById('appTitle').innerText = DATA.titolo || 'VespaTrek Live 🌍';
      document.getElementById('statsMini').innerText = `Totale: ${DATA.stats.kmTotali.toFixed(1)} km | ${DATA.stats.benzinaUsataLitri.toFixed(1)} L Benzina`;

      popolaPaesi();
      renderMap();
    } catch (e) {
      document.getElementById('statsMini').innerText = 'Errore caricamento dati';
      console.error(e);
    }
  }

  window.onload = loadData;
</script>

</body>
</html>
