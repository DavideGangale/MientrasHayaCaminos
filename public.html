<!doctype html>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --brand: #2196F3;
      --accent: #ff9800;
      --yt: #ff0000;
      --fuel: #4caf50;
      --maint: #9c27b0;
      --carb: #00bcd4;
    }

    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER E CONTROLLI ===== */
    #topBar {
      position: relative;
      width: 100%;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .social-link{
      width:30px;
      height:30px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid #444;
      border-radius:10px;
      background:#111;
      color:#fff;
      text-decoration:none;
      flex:0 0 auto;
    }
    .social-link svg{ width:18px; height:18px; display:block; }
    .social-link.ig{ border-color:#6a1b9a; }
    .social-link.yt{ border-color:#ff0000; color:#ff0000; }

    .stats-mini{
      font-size:12px;
      color:#aaa;
      font-weight:600;
      text-align:right;
      line-height:1.15;
      white-space:nowrap;
    }

    .top-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 5px;
    }

    select.btn-filter {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      outline: none;
    }

    button.btn-filter {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      grid-column: span 2;
    }

    /* ===== MAPPA ===== */
    #mapPub {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      z-index: 1;
    }

    /* ===== MARKERS PERSONALIZZATI ===== */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px !important;
      height: 34px !important;
      border-radius: 50%;
      font-size: 18px;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      margin-left: -17px !important;
      margin-top: -17px !important;
      color: #fff;
      z-index: 1000 !important;
    }
    .marker-foto { background: var(--accent); }
    .marker-video { background: var(--yt); font-size: 14px; }
    .marker-maint { background: var(--maint); }
    .marker-fuel  { background: var(--fuel); }
    .marker-carb  { background: var(--carb); }

    /* ===== POPUP LEAFLET ===== */
    .leaflet-popup-content-wrapper {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .leaflet-popup-tip { background: var(--card); border: 1px solid var(--border); }
    .popup-title { font-weight: 900; color: var(--accent); margin-bottom: 5px; font-size: 16px; }
    .popup-meta { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .popup-img { width: 100%; border-radius: 8px; margin-top: 8px; cursor: pointer; }
    .popup-video iframe { width: 100%; height: 160px; border-radius: 8px; margin-top: 8px; border:none; }

    /* ===== LIGHTBOX FOTO ===== */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 9999;
      align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }
    #lightboxClose {
      position: absolute; top: 15px; right: 15px;
      background: #f44336; color: #fff; border: none;
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 20px; font-weight: bold; cursor: pointer;
    }

function getYearMonthFromPublicEntry(entry) {
  if (entry && entry.ts) {
    const d = new Date(Number(entry.ts));
    if (!isNaN(d.getTime())) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      return `${y}-${m}`;
    }
  }

  const ds = String(entry?.data || '').trim();
  const m = ds.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    return `${m[3]}-${String(m[2]).padStart(2, '0')}`;
  }

  return '';
}

  
  // ===== Stats helpers (benzina bruciata da tappe/giri) =====
  const CONSUMO_FALLBACK_KM_L = 28;

  function getAllPercorsiPublic() {
    const tappe = Array.isArray(DATA?.tappe) ? DATA.tappe : [];
    const tur   = Array.isArray(DATA?.turismo) ? DATA.turismo : [];
    return tappe.concat(tur);
  }

  function calcFuelBurnedFromPercorsi(countryOrNull) {
    const all = getAllPercorsiPublic();
    let kmSum = 0;
    let litriSum = 0;

    for (const p of all) {
      if (!p) continue;
      if (countryOrNull && p.paese !== countryOrNull) continue;

      const km = Number(p.km || 0);
      if (!isFinite(km) || km <= 0) continue;

      kmSum += km;

      const realL = Number(p.benzinaRealeLitri);
      const stimL = Number(p.benzinaStimataLitri ?? p.benzina ?? 0);

      if (isFinite(realL) && realL > 0) litriSum += realL;
      else if (isFinite(stimL) && stimL > 0) litriSum += stimL;
      else litriSum += km / CONSUMO_FALLBACK_KM_L;
    }

    return { km: kmSum, litri: litriSum };
  }

  function getOlioUsatoLitriPublic(countryOrNull) {
    if (!DATA) return null;

    if (!countryOrNull) {
      return Number(DATA?.stats?.olioTotaleLitri || 0);
    }

    const dp = (DATA.datiPaesi && DATA.datiPaesi[countryOrNull]) ? DATA.datiPaesi[countryOrNull] : null;
    if (!dp) return null;

    if (dp.olioTotaleLitri != null) return Number(dp.olioTotaleLitri || 0);
    if (dp.olioMl != null) return Number(dp.olioMl || 0) / 1000;

    return null;
  }

  async function caricaTuttiIPaesiInCache() {
  const paesi = getIndexPaesiList();

  for (const meta of paesi) {
    if (!meta || !meta.paese || !meta.path) continue;
    if (PAESI_CACHE[meta.paese]) continue;

    const res = await fetch(meta.path);
    if (!res.ok) throw new Error('Errore caricamento file paese: ' + meta.path);

    PAESI_CACHE[meta.paese] = await res.json();
  }
}

  
async function caricaPaeseSeServe(paese) {
  if (!paese) {
    DATA = unisciDatasetGlobale();
    return;
  }

  const meta = getIndexPaesiList().find(x => x.paese === paese);
  if (!meta || !meta.path) {
    console.warn('Paese non trovato in index:', paese);
    DATA = unisciDatasetGlobale();
    return;
  }

  if (!PAESI_CACHE[paese]) {
    const res = await fetch(meta.path);
    if (!res.ok) throw new Error('Errore caricamento file paese: ' + meta.path);
    PAESI_CACHE[paese] = await res.json();
  }

  DATA = unisciDatasetPaese(PAESI_CACHE[paese]);
}

function unisciDatasetGlobale() {
  const paesiCaricati = Object.values(PAESI_CACHE || {});

  let tappe = [];
  let turismo = [];
  let diario = [];
  let rifornimenti = [];
  let carburazioni = [];
  let manutenzioni = [];

  for (const p of paesiCaricati) {
    if (!p) continue;

    if (Array.isArray(p.tappe)) tappe.push(...p.tappe);
    if (Array.isArray(p.turismo)) turismo.push(...p.turismo);
    if (Array.isArray(p.diario)) diario.push(...p.diario);
    if (Array.isArray(p.rifornimenti)) rifornimenti.push(...p.rifornimenti);
    if (Array.isArray(p.carburazioni)) carburazioni.push(...p.carburazioni);
    if (Array.isArray(p.manutenzioni)) manutenzioni.push(...p.manutenzioni);
  }

  // fallback: se ancora nessun paese è stato caricato, usa almeno gli ultimi elementi dall'index
  if (tappe.length === 0 && Array.isArray(INDEX_DATA?.ultimeTappe)) {
    tappe = INDEX_DATA.ultimeTappe.filter(x => (x.tipo || 'Tappa') !== 'Turismo');
    turismo = INDEX_DATA.ultimeTappe.filter(x => (x.tipo || '') === 'Turismo');
  }

  if (diario.length === 0 && Array.isArray(INDEX_DATA?.ultimiPost)) {
    diario = INDEX_DATA.ultimiPost;
  }

  // ordina per id/ts decrescente
  tappe.sort((a,b) => Number(b.id || 0) - Number(a.id || 0));
  turismo.sort((a,b) => Number(b.id || 0) - Number(a.id || 0));
  diario.sort((a,b) => Number((b.ts || b.id || 0)) - Number((a.ts || a.id || 0)));
  rifornimenti.sort((a,b) => Number(b.id || 0) - Number(a.id || 0));
  carburazioni.sort((a,b) => Number(b.id || 0) - Number(a.id || 0));
  manutenzioni.sort((a,b) => Number(b.id || 0) - Number(a.id || 0));

  return {
    titolo: INDEX_DATA?.titolo || 'VespaTrek Live 🌍',
    paeseAttuale: INDEX_DATA?.paeseAttuale || '',
    stats: INDEX_DATA?.stats || {},
    datiPaesi: buildDatiPaesiMapFromIndex(),
    tappe,
    turismo,
    diario,
    manutenzioni: manutenzioni.length ? manutenzioni : (OFFICINA_DATA?.manutenzioni || []),
    rifornimenti,
    carburazioni: carburazioni.length ? carburazioni : (OFFICINA_DATA?.carburazioni || [])
  };
}

function driveToDirectImageUrl(url){
  const s = String(url || '').trim();
  if (!s) return '';

  // già ok
  if (s.startsWith('data:image/')) return s;
  if (s.includes('googleusercontent.com')) return s;
  if (s.includes('drive.google.com/thumbnail')) return s;

  // estrae ID
  let m = s.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (!m) m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (!m) return s;

  const id = m[1];

  // ✅ thumbnail: spesso converte e funziona anche se l'originale è HEIC
  return `https://drive.google.com/thumbnail?id=${id}&sz=w1200`;
}
  

function getYouTubeId(url) {
  const s = String(url || '').trim();
  if (!s) return null;

  try {
    const u = new URL(s);

    // youtu.be/ID
    if (u.hostname.includes('youtu.be')) {
      const id = u.pathname.replace('/', '').trim();
      return id.length === 11 ? id : null;
    }

    // youtube.com/watch?v=ID
    const v = u.searchParams.get('v');
    if (v && v.length === 11) return v;

    // youtube.com/shorts/ID
    let m = u.pathname.match(/\/shorts\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];

    // youtube.com/embed/ID
    m = u.pathname.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];

    return null;
  } catch {
    // fallback regex
    const m = s.match(/(?:v=|youtu\.be\/|\/shorts\/|\/embed\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }
}

  function drawSeriesPub(canvasId, points, color, valueKey) {
    const cv = document.getElementById(canvasId);
    if (!cv) return;

    const rect = cv.getBoundingClientRect();
    const W = Math.max(320, Math.floor(rect.width));
    const H = Math.max(150, Math.floor(rect.height));
    cv.width = W;
    cv.height = H;

    const ctx = cv.getContext('2d');
    ctx.clearRect(0,0,W,H);

    if (!Array.isArray(points) || points.length < 2) {
      ctx.fillStyle = '#888';
      ctx.font = '14px system-ui';
      ctx.fillText('Dati insufficienti', 12, 28);
      return;
    }

    const xs = points.map(p => Number(p.km || 0));
    const ys = points.map(p => Number(p[valueKey] || 0));

    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    let yMin = Math.min(...ys), yMax = Math.max(...ys);

    if (!isFinite(xMin) || !isFinite(xMax) || xMax <= xMin) return;
    if (!isFinite(yMin) || !isFinite(yMax)) return;
    if (yMax === yMin) yMax = yMin + 1;

    const padL = 36, padR = 10, padT = 10, padB = 22;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for (let i=0;i<=4;i++){
      const y = padT + (plotH*i/4);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    }

    function X(x){ return padL + ((x - xMin) / (xMax - xMin)) * plotW; }
    function Y(y){ return padT + (1 - ((y - yMin) / (yMax - yMin))) * plotH; }

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X(xs[0]), Y(ys[0]));
    for (let i=1;i<points.length;i++) ctx.lineTo(X(xs[i]), Y(ys[i]));
    ctx.stroke();

    ctx.fillStyle = '#aaa';
    ctx.font = '12px system-ui';
    ctx.fillText(String(Math.round(yMax)), 6, padT+12);
    ctx.fillText(String(Math.round(yMin)), 6, padT+plotH);
    ctx.fillStyle = '#666';
    ctx.fillText(`${xMax.toFixed(1)} km`, W-72, H-8);
  }

  window.apriGraficoPercorsoPublic = function(id) {
    if (!DATA) return;

    const tappe = Array.isArray(DATA.tappe) ? DATA.tappe : [];
    const tur   = Array.isArray(DATA.turismo) ? DATA.turismo : [];
    const all   = tappe.concat(tur);

    const t = all.find(x => String(x.id) === String(id));
    if (!t) { alert('Percorso non trovato'); return; }

    const telem = Array.isArray(t.telemetry) ? t.telemetry : [];
    if (telem.length < 3) {
      alert('Nessuna telemetria nel JSON pubblico.\nDevi esportare anche "telemetry" dall’app privata.');
      return;
    }

    document.getElementById('graphTitle').innerText =
      `📈 ${t.tipo || 'Percorso'} — ${t.data || ''} ${t.ora || ''} — ${t.paese || ''}`;

    const altMin = Math.min(...telem.map(p => Number(p.alt||0)));
    const altMax = Math.max(...telem.map(p => Number(p.alt||0)));
    const spMax  = Math.max(...telem.map(p => Number(p.sp||0)));

    document.getElementById('graphInfo').innerHTML = `
      <div>📏 Km: <b>${Number(t.km||0).toFixed(1)}</b></div>
      <div>⛰️ Altitudine: <b>${Math.round(altMin)}</b> → <b>${Math.round(altMax)}</b> m</div>
      <div>🏎️ Vel max (telemetria): <b>${Math.round(spMax)}</b> km/h</div>
    `;

    document.getElementById('graphModal').style.display = 'flex';

    setTimeout(() => {
      drawSeriesPub('cvAltPub', telem, '#2196F3', 'alt');
      drawSeriesPub('cvSpdPub', telem, '#d32f2f', 'sp');
    }, 120);
  };

 async function loadData() {
  initMap();

  try {
    const urlParams = new URLSearchParams(window.location.search);
    const srcIndex = urlParams.get('src') || 'public/vespatrek_index.json';
    const srcOfficina = urlParams.get('officina') || 'public/officina.json';

    const [resIndex, resOfficina] = await Promise.all([
      fetch(srcIndex),
      fetch(srcOfficina)
    ]);

    if (!resIndex.ok) throw new Error('Errore caricamento index');
    if (!resOfficina.ok) throw new Error('Errore caricamento officina');

    
INDEX_DATA = await resIndex.json();
OFFICINA_DATA = await resOfficina.json();

// carica tutti i paesi in background PRIMA del primo render globale
await caricaTuttiIPaesiInCache();

DATA = unisciDatasetGlobale();

applyLang();
updateStatsMini();
popolaPaesi();
popolaMesi();
renderMap();

    
  } catch (e) {
    document.getElementById('statsMini').innerText = 'Errore caricamento dati';
    console.error(e);
  }
}

  window.onload = loadData;
</script>
