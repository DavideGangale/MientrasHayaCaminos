<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>VespaTrek — Pagina Pubblica</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#121212;color:#fff;padding:14px;}
    .card{background:#2c2c2c;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #444;}
    h1,h2{margin:0 0 10px 0}
    .muted{color:#aaa;font-size:13px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .box{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:10px}
    #mapPub{height:320px;border-radius:12px;border:1px solid #444}
    .btn{background:#2196F3;color:#fff;border:none;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
    select{width:100%;padding:10px;border-radius:10px;background:#111;color:#fff;border:1px solid #444}
    .entry{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:10px;margin-top:10px}
    img{max-width:100%;border-radius:12px;border:1px solid #333}

    .diario-thumb{
      width:100%;
      max-height:220px;
      object-fit:cover;
      border-radius:12px;
      border:1px solid #333;
      cursor:pointer;
    }
    #lightbox{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      z-index:9999;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    #lightbox.open{display:flex;}
    #lightbox img{
      max-width:96vw;
      max-height:90vh;
      border-radius:12px;
      border:1px solid #333;
    }
    #lightboxClose{
      position:fixed;
      top:14px;
      right:14px;
      background:#f44336;
      color:#fff;
      border:none;
      width:42px;
      height:42px;
      border-radius:50%;
      font-size:22px;
      cursor:pointer;
    }

    .diario-tools{
      display:grid;
      grid-template-columns: 1fr 160px;
      gap:10px;
      align-items:center;
      margin-bottom:10px;
    }
    .diario-tools input[type="search"]{
      width:100%;
      padding:10px;
      border-radius:10px;
      background:#111;
      color:#fff;
      border:1px solid #444;
    }
    .diario-tools .chk{
      grid-column:1 / -1;
      display:flex;
      gap:10px;
      align-items:center;
      color:#aaa;
      font-size:13px;
    }
    .diario-tools #diario-more{
      grid-column:1 / -1;
      width:100%;
    }
    @media (min-width: 700px){
      .diario-tools{
        grid-template-columns: 1fr 200px 200px 180px 160px;
      }
      .diario-tools .chk{
        grid-column:auto;
        justify-content:flex-start;
      }
      .diario-tools #diario-more{
        grid-column:auto;
        width:auto;
        justify-self:end;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="tit">VespaTrek — Pubblico</h1>
    <div class="muted" id="meta">Carico dati…</div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px;">Language / Idioma / Lingua</div>
    <select id="lang">
      <option value="it">Italiano</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>

  <div class="card">
    <h2 data-i18n="stats">📊 Statistiche</h2>
    <div class="grid">
      <div class="box"><span data-i18n="km_tot">KM totali</span><br><b id="st-km">--</b></div>
      <div class="box"><span data-i18n="benzina_l">Benzina (L)</span><br><b id="st-bz">--</b></div>
      <div class="box"><span data-i18n="spesa_tot">Spesa totale (USD)</span><br><b id="st-sp">--</b></div>
      <div class="box"><span data-i18n="olio_l">Olio (L)</span><br><b id="st-ol">--</b></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="routes">🗺️ Tappe / Turismo</h2>
    <div class="muted"><span data-i18n="pick_route">Seleziona un percorso per vedere la traccia.</span></div>

    <select id="selPerc"></select>

    <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center;">
      <button class="btn" id="btnKml" type="button" style="background:#00bcd4; color:#000;">
        ⬇️ KML (Google Earth)
      </button>
      <div class="muted" style="margin-top:6px;">
        KML: Google Earth / My Maps
      </div>
    </div>

    <div style="margin-top:10px" id="mapPub"></div>
    <div class="muted" id="percInfo" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2 data-i18n="diary">📖 Diario (con foto)</h2>

    <div class="diario-tools">
      <input id="diario-q" type="search" placeholder="Cerca nel diario (testo/paese/km)..." />

      <select id="diario-paese">
        <option value="">Tutti i paesi</option>
      </select>

      <select id="diario-tag">
        <option value="">Tutti i tag</option>
      </select>

      <label class="chk">
        <input id="diario-solo-foto" type="checkbox">
        Solo con foto
      </label>

      <button class="btn" id="diario-more" type="button">Carica altre</button>
    </div>

    <div id="diario"></div>
  </div>

  <div class="card">
    <h2 data-i18n="maint">🔧 Manutenzioni</h2>
    <div id="man"></div>
  </div>

<script>
  function qs(name){
    const u = new URL(location.href);
    return u.searchParams.get(name);
  }

  function moneyUsd(x){ return '$' + Number(x||0).toFixed(2); }

  function safeName(s) {
    return String(s || '')
      .trim()
      .replace(/[\/\\?%*:|"<>]/g, '-')
      .replace(/\s+/g, ' ')
      .slice(0, 90);
  }

  function downloadTextFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function shareOrDownloadFile(filename, content, mime) {
    try {
      const blob = new Blob([content], { type: mime || 'application/octet-stream' });
      if (navigator.share) {
        const file = new File([blob], filename, { type: mime || 'application/octet-stream' });
        if (!navigator.canShare || navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename, text: 'VespaTrek track' });
          return;
        }
      }
    } catch (e) {}
    downloadTextFile(filename, content, mime);
  }

  function coordsToKML(traccia, nome = 'VespaTrek') {
    const pts = Array.isArray(traccia) ? traccia : [];
    const norm = pts.map(p => {
      if (Array.isArray(p)) return [Number(p[1]), Number(p[0])]; // KML: lon,lat
      if (p && typeof p === 'object') return [Number(p.lng ?? p.lon), Number(p.lat)];
      return null;
    }).filter(p => p && isFinite(p[0]) && isFinite(p[1]));

    if (norm.length < 2) return null;

    const coordStr = norm.map(p => `${p[0].toFixed(6)},${p[1].toFixed(6)},0`).join(' ');
    const nomeSafe = String(nome || 'VespaTrek').replace(/[<>&"]/g, '');

    return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${nomeSafe}</name>
    <Placemark>
      <name>${nomeSafe}</name>
      <Style>
        <LineStyle><color>ff2f32d3</color><width>4</width></LineStyle>
      </Style>
      <LineString>
        <tessellate>1</tessellate>
        <coordinates>${coordStr}</coordinates>
      </LineString>
    </Placemark>
  </Document>
</kml>`;
  }

  const I18N = {
    it: {
      stats: '📊 Statistiche',
      routes: '🗺️ Tappe / Turismo',
      diary: '📖 Diario (con foto)',
      maint: '🔧 Manutenzioni',
      pick_route: 'Seleziona un percorso per vedere la traccia.',
      km_tot: 'KM totali',
      benzina_l: 'Benzina (L)',
      spesa_tot: 'Spesa totale (USD)',
      olio_l: 'Olio (L)',
      all_countries: 'Tutti i paesi',
      all_tags: 'Tutti i tag',
      only_photos: 'Solo con foto',
      load_more: 'Carica altre',
      search_ph: 'Cerca nel diario (testo/paese/km)...'
    },
    en: {
      stats: '📊 Stats',
      routes: '🗺️ Routes / Sightseeing',
      diary: '📖 Diary (with photos)',
      maint: '🔧 Maintenance',
      pick_route: 'Select a route to view the track.',
      km_tot: 'Total km',
      benzina_l: 'Fuel (L)',
      spesa_tot: 'Total cost (USD)',
      olio_l: '2T Oil (L)',
      all_countries: 'All countries',
      all_tags: 'All tags',
      only_photos: 'Photos only',
      load_more: 'Load more',
      search_ph: 'Search diary (text/country/km)...'
    },
    es: {
      stats: '📊 Estadísticas',
      routes: '🗺️ Rutas / Turismo',
      diary: '📖 Diario (con fotos)',
      maint: '🔧 Mantenimiento',
      pick_route: 'Selecciona una ruta para ver el recorrido.',
      km_tot: 'Km totales',
      benzina_l: 'Combustible (L)',
      spesa_tot: 'Gasto total (USD)',
      olio_l: 'Aceite 2T (L)',
      all_countries: 'Todos los países',
      all_tags: 'Todas las etiquetas',
      only_photos: 'Solo fotos',
      load_more: 'Cargar más',
      search_ph: 'Buscar en diario (texto/país/km)...'
    }
  };

  let LANG = localStorage.getItem('vt_pub_lang') || 'it';

  function t(key){
    return (I18N[LANG] && I18N[LANG][key]) ? I18N[LANG][key] : key;
  }

  function applyLang(){
    document.documentElement.lang = LANG;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });

    const q = document.getElementById('diario-q');
    if (q) q.placeholder = t('search_ph');

    const chk = document.querySelector('.diario-tools .chk');
    if (chk) {
      const input = chk.querySelector('input');
      chk.innerHTML = '';
      chk.appendChild(input);
      chk.append(' ' + t('only_photos'));
    }

    const more = document.getElementById('diario-more');
    if (more) more.textContent = t('load_more');
  }

  function escapeHtml(s){
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#39;");
  }

  function debounce(fn, ms=250){
    let t=null;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  }

  function fotoOf(d){
    return (d && (d.fotoUrl || d.foto)) ? (d.fotoUrl || d.foto) : null;
  }

  let map, poly, marker;
  let selectedPercorso = null;
  let photoLayer = null;

  // ===== DIARIO: stato filtri/paginazione
  let diarioAll = [];
  let diarioLimit = 12;

  // ===== LIGHTBOX
  let lbPhotos = [];
  let lbIndex = -1;

  let routePhotos = [];      // foto del percorso selezionato (per lightbox “contestuale”)
let routePhotoIndex = new Map(); // url -> index dentro routePhotos

  function initMap(){
    map = L.map('mapPub', { zoomControl:true, attributionControl:false }).setView([-15, -60], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom:19 }).addTo(map);
    poly = L.polyline([], { color:'#d32f2f', weight:4, opacity:0.9 }).addTo(map);
    marker = L.marker([-15, -60]).addTo(map);
    photoLayer = L.layerGroup().addTo(map);
  }

  function cleanCoords(coords) {
    if (!Array.isArray(coords)) return [];
    const out = [];
    for (const p of coords) {
      if (!Array.isArray(p) || p.length < 2) continue;
      const lat = Number(p[0]);
      const lon = Number(p[1]);
      if (!isFinite(lat) || !isFinite(lon)) continue;
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) continue;
      out.push([lat, lon]);
    }
    return out;
  }

  function setTrace(coords){
    if (!map || !poly || !marker) initMap();
    const cleaned = cleanCoords(coords);
    poly.setLatLngs(cleaned);

    if (cleaned.length > 1) {
      const last = cleaned[cleaned.length - 1];
      marker.setLatLng(last);
      const bounds = poly.getBounds();
      map.fitBounds(bounds.pad(0.15), { maxZoom: 14 });
    } else if (cleaned.length === 1) {
      marker.setLatLng(cleaned[0]);
      map.setView(cleaned[0], 13);
    } else {
      map.setView([-15, -60], 3);
      marker.setLatLng([-15, -60]);
    }
  }

  setTimeout(() => { if (map) map.invalidateSize(); }, 150);

  async function main(){
    const src = qs('src') || 'public/vespatrek_public.json';
    const res = await fetch(src, { cache:'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText} per ${src}`);

    const txt = await res.text();
    if (!txt || txt.trim().length < 5) throw new Error(`File JSON vuoto: ${src}`);
    if (!txt.trim().endsWith('}')) throw new Error(`JSON incompleto/troncato (size=${txt.length} chars): ${src}`);
    const data = JSON.parse(txt);

    const langSel = document.getElementById('lang');
    if (langSel) langSel.value = LANG;
    applyLang();

    document.getElementById('tit').innerText = data.titolo || 'VespaTrek';
    document.getElementById('meta').innerText = `Aggiornato: ${data._exportDate || '--'} · File: ${src}`;

    const st = data.stats || {};
    const spTot = (st.spesaBenzinaUsd||0) + (st.spesaOlioUsd||0) + (st.spesaRicambiUsd||0) + (st.spesaManodoperaUsd||0);

    document.getElementById('st-km').innerText = (st.kmTotali||0).toFixed(1);
    document.getElementById('st-bz').innerText = ((st.benzinaUsataLitri||0) + (st.benzinaFuoriTappaLitri||0)).toFixed(1);
    document.getElementById('st-ol').innerText = (st.olioTotaleLitri||0).toFixed(2);
    document.getElementById('st-sp').innerText = moneyUsd(spTot);

    // percorsi
    const lista = []
      .concat(data.tappe || [])
      .concat(data.turismo || [])
      .sort((a,b)=>(b.id||0)-(a.id||0));

    const sel = document.getElementById('selPerc');
    sel.innerHTML = lista.map(p => {
      const tipo = (p.tipo || 'Tappa');
      const label = `${p.data||''} ${p.ora||''} — ${p.paese||''} — ${tipo} — ${Number(p.km||0).toFixed(1)} km`;
      return `<option value="${p.id}">${escapeHtml(label)}</option>`;
    }).join('');

    if (!lista.length) {
      sel.innerHTML = `<option value="">(nessun percorso pubblicato)</option>`;
    }

    const btnKml = document.getElementById('btnKml');

    function buildFileName(p) {
      const tipo = p.tipo || 'Percorso';
      const paese = p.paese || '';
      const dataStr = (p.data || '').replaceAll('/','-');
      const km = Number(p.km || 0).toFixed(1);
      const titolo = p.titolo || '';
      return safeName(`VespaTrek_${tipo}_${dataStr}_${paese}_${km}km_${titolo}`) || 'VespaTrek';
    }

    function updateExportButtons() {
      const ok = selectedPercorso && Array.isArray(selectedPercorso.traccia) && selectedPercorso.traccia.length >= 2;
      if (btnKml) btnKml.disabled = !ok;
      if (btnKml) btnKml.style.opacity = ok ? '1' : '0.5';
    }

    if (btnKml) {
      btnKml.addEventListener('click', async () => {
        if (!selectedPercorso) return;
        const kml = coordsToKML(selectedPercorso.traccia, buildFileName(selectedPercorso));
        if (!kml) return alert('Traccia insufficiente per KML');
        await shareOrDownloadFile(buildFileName(selectedPercorso) + '.kml', kml, 'application/vnd.google-earth.kml+xml');
      });
    }

    function showPerc(id){
      const p = lista.find(x => String(x.id) === String(id));
      if (!p) return;

      selectedPercorso = p;

      const altMin = (p.altMin != null) ? Number(p.altMin) : null;
      const altMax = (p.altMax != null) ? Number(p.altMax) : null;
      const disl = (isFinite(altMin) && isFinite(altMax)) ? Math.max(0, altMax - altMin) : null;

      const info =
        `📏 ${Number(p.km||0).toFixed(1)} km · ` +
        `⛰️ alt: ${isFinite(altMin) ? Math.round(altMin) : '--'} → ${isFinite(altMax) ? Math.round(altMax) : '--'} m` +
        ` · Δ ${disl != null ? Math.round(disl) : '--'} m` +
        `\n⛽ stim: ${(p.benzinaStimataLitri??0).toFixed(2)} L · reale: ${(p.benzinaRealeLitri!=null?Number(p.benzinaRealeLitri).toFixed(2):'--')} L · ` +
        `km/L stim: ${(p.consumoStimatoKmL!=null?Number(p.consumoStimatoKmL).toFixed(2):'--')} · km/L reale: ${(p.consumoRealeKmL!=null?Number(p.consumoRealeKmL).toFixed(2):'--')}`;

      document.getElementById('percInfo').innerText = info;

      setTrace(p.traccia || []);

     // markers foto (diario) dentro start/end del percorso selezionato
if (photoLayer) photoLayer.clearLayers();

const startTs = Number(p.startTs || 0);
const endTs = Number(p.endTs || 0);

// margine per includere foto scattate poco prima/dopo
const MARGIN = 15 * 60 * 1000;

const pics = (Array.isArray(data.diario) ? data.diario : [])
  .filter(d => d && d.geo && isFinite(d.geo.lat) && isFinite(d.geo.lon))
  .filter(d => !!fotoOf(d))
  .filter(d => {
    const ts = Number(d.ts || d.id || 0);
    if (startTs && endTs) return ts >= (startTs - MARGIN) && ts <= (endTs + MARGIN);
    return true; // fallback se mancano start/end
  });

// ✅ Prepara la “playlist” foto del percorso per lightbox
routePhotos = pics.map(fotoOf).filter(Boolean);
routePhotoIndex = new Map();
routePhotos.forEach((url, i) => routePhotoIndex.set(url, i));



pics.forEach(d => {
  const lat = Number(d.geo.lat), lon = Number(d.geo.lon);
  const foto = fotoOf(d);

  const html = `
    <div style="min-width:180px">
      <div style="font-weight:700; margin-bottom:6px;">${escapeHtml(d.paese||'')}</div>

      ${foto ? `
        <img src="${foto}"
             class="diario-thumb"
             style="max-height:140px"
             onclick="openRouteLightboxByUrl('${String(foto).replaceAll("'", "\\'")}')">
      ` : ''}

      <div class="muted" style="margin-top:6px;">${escapeHtml(d.data||'')} ${escapeHtml(d.ora||'')} — km ${escapeHtml(d.km||'')}</div>
      <div style="margin-top:6px; white-space:pre-wrap; color:#ddd;">${escapeHtml((d.testo||'').slice(0,140))}</div>

      ${foto ? `
        <button class="btn" type="button" style="margin-top:10px; width:100%; background:#ff9800; color:#000;"
                onclick="openRouteLightboxByUrl('${String(foto).replaceAll("'", "\\'")}')">
          Apri foto
        </button>
      ` : ''}
    </div>
  `;

  // ✅ Marker cliccabile: click = lightbox
  const m = L.circleMarker([lat, lon], {
    radius: 7,
    color: '#ff9800',
    fillColor: '#ff9800',
    fillOpacity: 0.9
  }).addTo(photoLayer);

 m.bindPopup(html);

// ✅ Preview: solo hover (desktop)
m.on('mouseover', () => m.openPopup());
m.on('mouseout', () => m.closePopup());

// ✅ Click: apre lightbox e chiude SEMPRE la preview
m.on('click', () => {
  try { m.closePopup(); } catch {}
  try { if (map) map.closePopup(); } catch {}
  if (foto) openRouteLightboxByUrl(foto);
});
});
    }

    initMap();

    sel.onchange = () => {
      showPerc(sel.value);
      updateExportButtons();
    };

    if (lista.length) {
      showPerc(lista[0].id);
      updateExportButtons();
    } else {
      selectedPercorso = null;
      setTrace([]);
      updateExportButtons();
    }

    // ===== DIARIO (filtri + paginazione + TAG) =====
    diarioAll = Array.isArray(data.diario) ? data.diario : [];
    diarioLimit = 12;

    // ✅ foto lista lightbox: usa fotoUrl || foto
    lbPhotos = diarioAll.map(fotoOf).filter(Boolean);

    // popola dropdown PAESE
    const selPaese = document.getElementById('diario-paese');
    if (selPaese) {
      const paesi = [...new Set(diarioAll.map(d => d.paese).filter(Boolean))].sort();
      selPaese.innerHTML =
        `<option value="">${escapeHtml(t('all_countries'))}</option>` +
        paesi.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    }

    // popola dropdown TAG
    const selTag = document.getElementById('diario-tag');
    if (selTag) {
      const preset = Array.isArray(data.diarioTagsPreset) ? data.diarioTagsPreset : [];
      const fromData = [...new Set(diarioAll.flatMap(d => Array.isArray(d.tags) ? d.tags : []))].sort();
      const tags = preset.length ? preset : fromData;

      selTag.innerHTML =
        `<option value="">${escapeHtml(t('all_tags'))}</option>` +
        tags.map(tg => `<option value="${escapeHtml(tg)}">${escapeHtml(tg)}</option>`).join('');
    }

    const qEl = document.getElementById('diario-q');
    const fotoOnlyEl = document.getElementById('diario-solo-foto');
    const moreBtn = document.getElementById('diario-more');

    const rerender = () => renderDiarioPub();

    if (qEl) qEl.addEventListener('input', debounce(() => { diarioLimit = 12; rerender(); }, 250));
    if (selPaese) selPaese.addEventListener('change', () => { diarioLimit = 12; rerender(); });
    if (selTag) selTag.addEventListener('change', () => { diarioLimit = 12; rerender(); });
    if (fotoOnlyEl) fotoOnlyEl.addEventListener('change', () => { diarioLimit = 12; rerender(); });

    if (moreBtn) {
      moreBtn.addEventListener('click', () => {
        diarioLimit += 12;
        rerender();
      });
    }

    renderDiarioPub();

    // manutenzioni
    const man = data.manutenzioni || [];
    document.getElementById('man').innerHTML = man.map(m => `
      <div class="entry">
        <div><b>${escapeHtml(m.nome||'')}</b></div>
        <div class="muted">${escapeHtml(m.data||'')} ${escapeHtml(m.ora||'')} — ${escapeHtml(m.paese||'')} — km ${escapeHtml(m.km||'')}</div>
        ${m.desc ? `<div style="margin-top:6px; white-space:pre-wrap;">${escapeHtml(m.desc||'')}</div>` : ''}
        ${(m.costoUsd && Number(m.costoUsd)>0) ? `<div class="muted" style="margin-top:6px;">Costo ≈ ${moneyUsd(m.costoUsd)}</div>` : ''}
        ${(m.fotoUrl) ? `<div style="margin-top:8px;"><img class="diario-thumb" src="${m.fotoUrl}" loading="lazy" onclick="openLightboxDirect('${m.fotoUrl}')"></div>` : ''}
      </div>
    `).join('') || '<div class="muted">Nessun intervento</div>';
  }

  main().catch(err => {
    document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#fff;">Errore: ' + (err && err.stack ? err.stack : err) + '</pre>';
  });

  function renderDiarioPub(){
    const container = document.getElementById('diario');
    if (!container) return;

    const q = (document.getElementById('diario-q')?.value || '').trim().toLowerCase();
    const paeseSel = document.getElementById('diario-paese')?.value || '';
    const tagSel = document.getElementById('diario-tag')?.value || '';
    const soloFoto = !!document.getElementById('diario-solo-foto')?.checked;

    let list = [...diarioAll];

    if (paeseSel) list = list.filter(d => String(d.paese||'') === String(paeseSel));
    if (tagSel) list = list.filter(d => Array.isArray(d.tags) && d.tags.includes(tagSel));
    if (soloFoto) list = list.filter(d => !!fotoOf(d));

    if (q) {
      list = list.filter(d => {
        const hay = `${d.data||''} ${d.ora||''} ${d.paese||''} ${d.km||''} ${d.testo||''}`.toLowerCase();
        return hay.includes(q);
      });
    }

    list.sort((a,b) => (b.id||0) - (a.id||0));
    const shown = list.slice(0, diarioLimit);

    if (!shown.length) {
      container.innerHTML = '<div class="muted">Nessuna voce (con questi filtri)</div>';
    } else {
      container.innerHTML = shown.map(d => {
        const testoSafe = escapeHtml(d.testo || '');
        const metaSafe = `📅 ${escapeHtml(d.data||'')} ${escapeHtml(d.ora||'')} — ${escapeHtml(d.paese||'')} — km ${escapeHtml(d.km||'')}`;

        const foto = fotoOf(d);
        let fotoHtml = '';

        if (foto) {
          const idx = lbPhotos.findIndex(x => x === foto);
          const idxOk = (idx >= 0) ? idx : 0;
          fotoHtml = `
            <div style="margin-top:8px;">
              <img class="diario-thumb"
                   src="${foto}"
                   loading="lazy"
                   onclick="openLightboxIndex(${idxOk})">
            </div>
          `;
        }

        return `
          <div class="entry">
            <div class="muted">${metaSafe}</div>

            ${Array.isArray(d.tags) && d.tags.length ? `
              <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;">
                ${d.tags.map(tg => `<span style="font-size:11px; padding:4px 8px; border-radius:999px; background:#111; border:1px solid #333; color:#ff9800; font-weight:700;">${escapeHtml(tg)}</span>`).join('')}
              </div>
            ` : ''}

            <div style="margin-top:6px; white-space:pre-wrap;">${testoSafe}</div>
            ${fotoHtml}
          </div>
        `;
      }).join('');
    }

    const moreBtn = document.getElementById('diario-more');
    if (moreBtn) {
      moreBtn.style.display = (list.length > diarioLimit) ? 'block' : 'none';
      moreBtn.innerText = (list.length > diarioLimit)
        ? `${t('load_more')} (${Math.min(12, list.length - diarioLimit)} / ${list.length - diarioLimit})`
        : t('load_more');
    }
  }


function openRouteLightboxByUrl(url){
  if (!url) return;

  // se ho foto del percorso, uso quelle (frecce = solo foto di questa tappa)
  if (routePhotos && routePhotos.length) {
    lbPhotos = routePhotos;
    const idx = routePhotoIndex.get(url);
    openLightboxIndex(isFinite(idx) ? idx : 0);
    return;
  }

  // fallback: usa lightbox “globale”
  openLightboxDirect(url);
}

  
  function openLightboxDirect(url){
    if (!url) return;
    lbPhotos = [url];
    openLightboxIndex(0);
  }

  function openLightboxIndex(i){
    if (!Array.isArray(lbPhotos) || lbPhotos.length === 0) return;
    if (!isFinite(i) || i < 0) i = 0;
    if (i >= lbPhotos.length) i = lbPhotos.length - 1;

    lbIndex = i;

    const box = document.getElementById('lightbox');
    const img = document.getElementById('lightboxImg');
    if (!box || !img) return;

    img.src = lbPhotos[lbIndex];
    box.classList.add('open');
  }

  function lightboxNext(){
    if (!lbPhotos.length) return;
    lbIndex = (lbIndex + 1) % lbPhotos.length;
    const img = document.getElementById('lightboxImg');
    if (img) img.src = lbPhotos[lbIndex];
  }

  function lightboxPrev(){
    if (!lbPhotos.length) return;
    lbIndex = (lbIndex - 1 + lbPhotos.length) % lbPhotos.length;
    const img = document.getElementById('lightboxImg');
    if (img) img.src = lbPhotos[lbIndex];
  }

  function closeLightbox(){
  const box = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  if (img) img.src = '';
  if (box) box.classList.remove('open');

  // ✅ chiudi eventuali preview rimaste aperte sulla mappa
  try { if (map) map.closePopup(); } catch {}
}

  window.addEventListener('keydown', (e) => {
    const boxOpen = document.getElementById('lightbox')?.classList.contains('open');
    if (!boxOpen) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') lightboxNext();
    if (e.key === 'ArrowLeft') lightboxPrev();
  });

  document.getElementById('lang')?.addEventListener('change', (e) => {
    LANG = e.target.value;
    localStorage.setItem('vt_pub_lang', LANG);
    applyLang();
    try { renderDiarioPub(); } catch {}
  });
</script>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightboxClose" onclick="event.stopPropagation(); closeLightbox()">×</button>

  <button onclick="event.stopPropagation(); lightboxPrev()"
    style="position:fixed;left:14px;top:50%;transform:translateY(-50%);
           background:#333;color:#fff;border:none;width:42px;height:42px;border-radius:50%;
           font-size:18px;cursor:pointer;">‹</button>

  <img id="lightboxImg" alt="Foto diario" onclick="event.stopPropagation();">

  <button onclick="event.stopPropagation(); lightboxNext()"
    style="position:fixed;right:14px;top:50%;transform:translateY(-50%);
           background:#333;color:#fff;border:none;width:42px;height:42px;border-radius:50%;
           font-size:18px;cursor:pointer;">›</button>
</div>
