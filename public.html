<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>VespaTrek — Live Map</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #333;
      --text: #fff;
      --brand: #2196F3;
      --accent: #ff9800;
      --yt: #ff0000;
      --fuel: #4caf50;
      --maint: #9c27b0;
      --carb: #00bcd4;
    }

    * { box-sizing: border-box; }
   
    html {
      height: 100%;
    }
    body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER E CONTROLLI ===== */
    #topBar {
      position: relative;
      width: 100%;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

   .header-title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.social-link{
  width:30px;
  height:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #444;
  border-radius:10px;
  background:#111;
  color:#fff;
  text-decoration:none;
  flex:0 0 auto;
}
.social-link svg{ width:18px; height:18px; display:block; }
.social-link.ig{ border-color:#6a1b9a; }
.social-link.yt{ border-color:#ff0000; color:#ff0000; }



    .top-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 5px;
    }

    select.btn-filter {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      outline: none;
    }

    button.btn-filter {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      grid-column: span 2;
    }

    /* ===== MAPPA ===== */
    #mapPub {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      z-index: 1;
    }

    /* ===== MARKERS PERSONALIZZATI ===== */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px !important;
      height: 34px !important;
      border-radius: 50%;
      font-size: 18px;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      margin-left: -17px !important;
      margin-top: -17px !important;
      color: #fff;
      z-index: 1000 !important;
    }
    .marker-foto { background: var(--accent); }
    .marker-video { background: var(--yt); font-size: 14px; }
    .marker-maint { background: var(--maint); }
    .marker-fuel  { background: var(--fuel); }
    .marker-carb  { background: var(--carb); }

    /* ===== POPUP LEAFLET ===== */
    .leaflet-popup-content-wrapper {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .leaflet-popup-tip { background: var(--card); border: 1px solid var(--border); }
    .popup-title { font-weight: 900; color: var(--accent); margin-bottom: 5px; font-size: 16px; }
    .popup-meta { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .popup-img { width: 100%; border-radius: 8px; margin-top: 8px; cursor: pointer; }
    .popup-video iframe { width: 100%; height: 160px; border-radius: 8px; margin-top: 8px; border:none; }

    /* ===== LIGHTBOX FOTO ===== */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 9999;
      align-items: center; justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }
    #lightboxClose {
      position: absolute; top: 15px; right: 15px;
      background: #f44336; color: #fff; border: none;
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 20px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- HEADER & FILTRI -->
  <div id="topBar">
    <div class="header-title">
  <div class="title-left">
    <span id="appTitle">VespaTrek Live 🌍</span>

    <a class="social-link ig" href="https://www.instagram.com/lapizzadidavide?utm_source=qr&igsh=cDU0ZXBhYTNpb3dr" target="_blank" rel="noopener"
       aria-label="Instagram">
      <!-- icona IG -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3Zm-5 4.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2Zm0 2A1.8 1.8 0 1 0 13.8 12 1.8 1.8 0 0 0 12 10.2ZM17.6 6.7a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9Z"/>
      </svg>
    </a>

    <a class="social-link yt" href="https://youtube.com/@davidegangale?si=L5182Vj_sBj9rTxY" target="_blank" rel="noopener"
       aria-label="YouTube">
      <!-- icona YT -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M21.6 7.2a3 3 0 0 0-2.1-2.1C17.7 4.6 12 4.6 12 4.6s-5.7 0-7.5.5A3 3 0 0 0 2.4 7.2 31.6 31.6 0 0 0 2 12a31.6 31.6 0 0 0 .4 4.8 3 3 0 0 0 2.1 2.1c1.8.5 7.5.5 7.5.5s5.7 0 7.5-.5a3 3 0 0 0 2.1-2.1A31.6 31.6 0 0 0 22 12a31.6 31.6 0 0 0-.4-4.8ZM10 15.5v-7l6 3.5-6 3.5Z"/>
      </svg>
    </a>
  </div>

  <div id="statsMini" class="stats-mini">Caricamento...</div>
</div>
    
    <div class="top-controls">
      <select id="modeSelect" class="btn-filter" onchange="setMode(this.value)">
        <option value="TUTTO">🛣️ Tutte le tracce</option>
        <option value="TAPPE">🏁 Solo Tappe</option>
        <option value="GIRI">🛵 Solo Giri</option>
      </select>
      
      <select id="selectCountry" class="btn-filter" onchange="setCountry(this.value)">
        <option value="">🌎 Globale</option>
      </select>

     <select id="markerSelect" class="btn-filter" onchange="setMarkerFilter(this.value)">
        <option value="ALL">📍 Tutti i Marker</option>
        <option value="FOTO">📷 Foto</option>
        <option value="VIDEO">▶️ Video</option>
        <option value="MAINT">🔧 Officina</option>
        <option value="FUEL">⛽ Rifornimenti</option>
        <option value="CARB">🌬️ Carburazione</option>
      </select>


<select id="langSelect" class="btn-filter" onchange="setLang(this.value)">
  <option value="it">🇮🇹 Italiano</option>
  <option value="en">🇬🇧 English</option>
  <option value="es">🇪🇸 Español</option>
</select>
      
      <button id="btnStats" class="btn-filter" onclick="apriStats()">📊 Statistiche</button>
    </div>
  </div>

  <!-- MAPPA -->
  <div id="mapPub"></div>

  <!-- MODALE STATISTICHE -->
  <div id="statsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:8000; align-items:center; justify-content:center; padding:15px;">
    <div style="background:var(--card); width:100%; max-width:500px; border-radius:15px; border:2px solid var(--accent); padding:20px; position:relative; max-height: 90vh; overflow-y: auto;">
      <button onclick="document.getElementById('statsModal').style.display='none'" style="position:absolute; top:10px; right:10px; background:#f44336; color:#fff; border:none; border-radius:50%; width:30px; height:30px; font-weight:bold; cursor:pointer;">×</button>
      <h2 style="color:var(--accent); margin-top:0; text-align:center;">📊 Statistiche</h2>

      <select id="statsCountryFilter" class="btn-filter" style="margin-bottom:15px;" onchange="renderStatsDati()">
        <option value="GLOBAL">🌎 Globali</option>
      </select>

      <div id="statsModalContent" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; text-align:center;">
      </div>
    </div>
  </div>




<!-- MODALE GRAFICO -->
<div id="graphModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:8500; align-items:center; justify-content:center; padding:15px;">
  <div style="background:var(--card); width:100%; max-width:820px; border-radius:15px; border:2px solid var(--brand); padding:16px; position:relative; max-height: 90vh; overflow-y:auto;">
    <button onclick="closeGraphModal()"
            style="position:absolute; top:10px; right:10px; background:#f44336; color:#fff; border:none; border-radius:50%; width:30px; height:30px; font-weight:bold; cursor:pointer;">×</button>

    <h2 id="graphTitle" style="color:var(--brand); margin-top:0; text-align:center;">📈 Grafico</h2>

    <div style="background:#111; border:1px solid #333; border-radius:12px; padding:10px;">
      <div style="font-size:12px;color:#aaa;margin-bottom:6px;">Altitudine</div>
      <canvas id="cvAltPub" style="width:100%; height:160px; display:block;"></canvas>
    </div>

    <div style="background:#111; border:1px solid #333; border-radius:12px; padding:10px; margin-top:10px;">
      <div style="font-size:12px;color:#aaa;margin-bottom:6px;">Velocità</div>
      <canvas id="cvSpdPub" style="width:100%; height:160px; display:block;"></canvas>
    </div>

    <div id="graphInfo" style="font-size:12px;color:#888;text-align:left;margin-top:10px;"></div>
  </div>
</div>
  
  <!-- LIGHTBOX FOTO -->
  <div id="lightbox" onclick="closeLightbox()">
    <button id="lightboxClose" onclick="event.stopPropagation(); closeLightbox()">×</button>
    <img id="lightboxImg" onclick="event.stopPropagation();">
  </div>

<script>
  let DATA = null;
  let map = null;
  let layerTracce = null;
  let layerMarkers = null;

  let currentMode = 'TUTTO';
  let currentCountry = '';
  let currentMarkerFilter = 'ALL';



  // ===== LINGUA (i18n) =====
let LANG = localStorage.getItem('vt_pub_lang') || 'it';

const I18N = {
  it: {
    live: 'VespaTrek Live 🌍',
    allTracks: '🛣️ Tutte le tracce',
    onlyTappe: '🏁 Solo Tappe',
    onlyGiri: '🛵 Solo Giri',

    allMarkers: '📍 Tutti i Marker',
    foto: '📷 Foto',
    video: '▶️ Video',
    maint: '🔧 Officina',
    fuel: '⛽ Rifornimenti',
    carb: '🌬️ Carburazione',

    statsBtn: '📊 Statistiche',
    statsTitle: '📊 Statistiche',
    global: '🌎 Globali',
    totalMini: (km, l) => `Totale: ${km} km | ${l} L Benzina`,
    loading: 'Caricamento...',

    totalLbl: 'Totale',
fuelLbl: 'Benzina',

tappa: 'TAPPA',
giri: 'GIRI',

  },

  en: {
    live: 'VespaTrek Live 🌍',
    allTracks: '🛣️ All tracks',
    onlyTappe: '🏁 Trips only',
    onlyGiri: '🛵 Rides only',

    allMarkers: '📍 All markers',
    foto: '📷 Photos',
    video: '▶️ Videos',
    maint: '🔧 Workshop',
    fuel: '⛽ Fuel stops',
    carb: '🌬️ Carb setup',

    statsBtn: '📊 Stats',
    statsTitle: '📊 Stats',
    global: '🌎 Global',
    totalMini: (km, l) => `Total: ${km} km | ${l} L Fuel`,
    loading: 'Loading...',

    tappa: 'TRIP',
giri: 'RIDE',
time: '⏱️ Time',
alt: '⛰️ Alt',
speedMax: '🏎️ Max speed',
speedAvg: 'Avg',
fuelEst: '⛽ Estimated fuel',
fuelReal: '🔥 Real fuel',
consumption: 'Consumption',
details: 'Details',
graph: '📈 Chart',

refuel: '⛽ Refuel',
paid: 'Paid',
destination: 'Destination',

workshop: '🔧 Workshop',
cost: 'Cost',

carbSetup: '🌬️ Carb setup',
altitude: 'Altitude',
totalLbl: 'Total',
fuelLbl: 'Fuel'
    
  },

  es: {
    live: 'VespaTrek Live 🌍',
    allTracks: '🛣️ Todas las rutas',
    onlyTappe: '🏁 Solo Etapas',
    onlyGiri: '🛵 Solo Paseos',

    allMarkers: '📍 Todos los marcadores',
    foto: '📷 Fotos',
    video: '▶️ Videos',
    maint: '🔧 Taller',
    fuel: '⛽ Repostajes',
    carb: '🌬️ Carburación',

    statsBtn: '📊 Estadísticas',
    statsTitle: '📊 Estadísticas',
    global: '🌎 Global',
    totalMini: (km, l) => `Total: ${km} km | ${l} L Gasolina`,
    loading: 'Cargando...',

    tappa: 'ETAPA',
giri: 'PASEO',
time: '⏱️ Tiempo',
alt: '⛰️ Alt',
speedMax: '🏎️ Vel. máx',
speedAvg: 'Media',
fuelEst: '⛽ Gasolina estimada',
fuelReal: '🔥 Gasolina real',

refuel: '⛽ Repostaje',

carbSetup: '🌬️ Carburación',

    totalLbl: 'Total',
fuelLbl: 'Gasolina'

    
  }
};

function T(key) {
  const d = I18N[LANG] || I18N.it;
  return d[key] ?? (I18N.it[key] ?? key);
}

function setLang(l) {
  LANG = l || 'it';
  localStorage.setItem('vt_pub_lang', LANG);
  applyLang();
  updateStatsMini();
  renderMap();           // aggiorna testi che dipendono dai filtri
  if (document.getElementById('statsModal')?.style.display === 'flex') {
    renderStatsDati();   // aggiorna modal se è aperto
  }
}

function applyLang() {
  // select lingua
  const langSel = document.getElementById('langSelect');
  if (langSel) langSel.value = LANG;

  // titolo in alto (mantieni eventuale DATA.titolo, ma se è vuoto usa traduzione)
  const titleEl = document.getElementById('appTitle');
  if (titleEl) titleEl.innerText = (DATA && DATA.titolo) ? DATA.titolo : T('live');

  // bottone statistiche e titolo modal
  const btnStats = document.getElementById('btnStats');
  if (btnStats) btnStats.innerText = T('statsBtn');

  // titolo dentro modal
  const h2 = document.querySelector('#statsModal h2');
  if (h2) h2.innerText = T('statsTitle');

  // MODO TRACCE
  const modeSel = document.getElementById('modeSelect');
  if (modeSel) {
    const v = modeSel.value || 'TUTTO';
    modeSel.innerHTML = `
      <option value="TUTTO">${T('allTracks')}</option>
      <option value="TAPPE">${T('onlyTappe')}</option>
      <option value="GIRI">${T('onlyGiri')}</option>
    `;
    modeSel.value = v;
  }

  // MARKER FILTER
  const markerSel = document.getElementById('markerSelect');
  if (markerSel) {
    const v = markerSel.value || 'ALL';
    markerSel.innerHTML = `
      <option value="ALL">${T('allMarkers')}</option>
      <option value="FOTO">${T('foto')}</option>
      <option value="VIDEO">${T('video')}</option>
      <option value="MAINT">${T('maint')}</option>
      <option value="FUEL">${T('fuel')}</option>
      <option value="CARB">${T('carb')}</option>
    `;
    markerSel.value = v;
  }

  // stats filter: cambia solo la label "Globali"
  const statsSel = document.getElementById('statsCountryFilter');
  if (statsSel) {
    const v = statsSel.value || 'GLOBAL';
    const firstOpt = statsSel.querySelector('option[value="GLOBAL"]');
    if (firstOpt) firstOpt.innerText = T('global');
    statsSel.value = v;
  }
}

function updateStatsMini() {
  const el = document.getElementById('statsMini');
  if (!el) return;

  if (!DATA || !DATA.stats) {
    el.innerText = T('loading');
    return;
  }

  const km = Number(DATA.stats.kmTotali || 0).toFixed(1);
  const l  = Number(DATA.stats.benzinaUsataLitri || 0).toFixed(1);

  // ✅ 2 righe fisse
  el.innerHTML = `${T('totalLbl')}: ${km} km<br>${T('fuelLbl')}: ${l} L`;
}

  
  
  function initMap() {
    map = L.map('mapPub', { zoomControl: false }).setView([4.7, -74.1], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    layerTracce = L.layerGroup().addTo(map);
    layerMarkers = L.layerGroup().addTo(map);
  }

  function getYouTubeId(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  const iconFoto = L.divIcon({ className: 'custom-marker marker-foto', html: '📷' });
  const iconVideo = L.divIcon({ className: 'custom-marker marker-video', html: '▶️' });
  const iconMaint = L.divIcon({ className: 'custom-marker marker-maint', html: '🔧' });
  const iconFuel = L.divIcon({ className: 'custom-marker marker-fuel', html: '⛽' });
  const iconCarb = L.divIcon({ className: 'custom-marker marker-carb', html: '🌬️' });

  function renderMap() {
    layerTracce.clearLayers();
    layerMarkers.clearLayers();

    if (!DATA) return;

    let bounds = L.latLngBounds();
    let drawnLines = 0;

    const tappe = Array.isArray(DATA.tappe) ? DATA.tappe : [];
    const turismo = Array.isArray(DATA.turismo) ? DATA.turismo : [];

    let tracceDaMostrare = [];
    if (currentMode === 'TUTTO' || currentMode === 'TAPPE') tracceDaMostrare.push(...tappe);
    if (currentMode === 'TUTTO' || currentMode === 'GIRI') tracceDaMostrare.push(...turismo);

    tracceDaMostrare.forEach(t => {
      if (currentCountry && t.paese !== currentCountry) return;
      if (!t.traccia || t.traccia.length < 2) return;

      const latlngs = t.traccia.map(p => Array.isArray(p) ? [p[0], p[1]] : [p.lat, p.lon || p.lng]);
      const color = t.tipo === 'Turismo' ? '#2196F3' : '#d32f2f';

      const poly = L.polyline(latlngs, { color: color, weight: 4, opacity: 0.8, interactive: false }).addTo(layerTracce);
      const clickPoly = L.polyline(latlngs, { color: 'transparent', weight: 30, opacity: 0.01 }).addTo(layerTracce);
      
      bounds.extend(poly.getBounds());
      drawnLines++;

      const h = Math.floor((t.durata || 0) / 3600);
      const m = Math.floor(((t.durata || 0) % 3600) / 60);
      const consHtml = (t.benzinaStimataLitri > 0) ? `<div>⛽ Consumo: <b>${(t.km / t.benzinaStimataLitri).toFixed(1)} km/L</b></div>` : '';

 
const tipo = t.tipo || 'Tappa';
const isGiro = (tipo === 'Turismo');

const benzStim = Number(t.benzinaStimataLitri ?? t.benzina ?? 0);
const benzReal = Number(t.benzinaRealeLitri ?? 0);

const consStim = (benzStim > 0) ? (t.km / benzStim).toFixed(2) : '--';
const consReal = (benzReal > 0) ? (t.km / benzReal).toFixed(2) : '--';

const hasGraph = Array.isArray(t.telemetry) && t.telemetry.length >= 3;

const infoEstesa = `
  <div class="popup-title">
    ${isGiro ? '🛵' : '🏁'} ${isGiro ? T('giri') : T('tappa')} — ${t.paese}
  </div>
  <div class="popup-meta">📅 ${t.data} ${t.ora || ''} | 📏 <b>${Number(t.km || 0).toFixed(1)} km</b></div>

  <div style="font-size:13px; margin-bottom:8px; line-height:1.45;">
    <div>${T('time')}: ${h}h ${m}m</div>
    <div>${T('alt')}: ${t.altMin || 0}m → ${t.altMax || 0}m</div>
    <div>
      ${T('speedMax')}: <b>${t.velMax || 0}</b> km/h
      ${t.velMedia ? ` (${T('speedAvg')}: <b>${t.velMedia}</b>)` : ''}
    </div>

    <div style="margin-top:6px;">
      ${T('fuelEst')}: <b>${benzStim.toFixed(2)} L</b> —
      <b style="color:var(--accent)">${consStim} km/L</b>
    </div>

    ${benzReal > 0 ? `
      <div>
        ${T('fuelReal')}: <b>${benzReal.toFixed(2)} L</b> —
        <b style="color:#4caf50">${consReal} km/L</b>
      </div>
    ` : ``}
  </div>

  ${t.titolo ? `<div style="font-weight:900; margin-bottom:4px; color:var(--accent);">📍 ${t.titolo}</div>` : ''}

function drawSeriesPub(canvasId, points, color, valueKey) {
  const cv = document.getElementById(canvasId);
  if (!cv) return;

  const rect = cv.getBoundingClientRect();
  const W = Math.max(320, Math.floor(rect.width));
  const H = Math.max(150, Math.floor(rect.height));
  cv.width = W;
  cv.height = H;

  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,W,H);

  if (!Array.isArray(points) || points.length < 2) {
    ctx.fillStyle = '#888';
    ctx.font = '14px system-ui';
    ctx.fillText('Dati insufficienti', 12, 28);
    return;
  }

  const xs = points.map(p => Number(p.km || 0));
  const ys = points.map(p => Number(p[valueKey] || 0));

  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);

  if (!isFinite(xMin) || !isFinite(xMax) || xMax <= xMin) return;
  if (!isFinite(yMin) || !isFinite(yMax)) return;
  if (yMax === yMin) yMax = yMin + 1;

  const padL = 36, padR = 10, padT = 10, padB = 22;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  // griglia
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  for (let i=0;i<=4;i++){
    const y = padT + (plotH*i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  }

  function X(x){ return padL + ((x - xMin) / (xMax - xMin)) * plotW; }
  function Y(y){ return padT + (1 - ((y - yMin) / (yMax - yMin))) * plotH; }

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(X(xs[0]), Y(ys[0]));
  for (let i=1;i<points.length;i++) ctx.lineTo(X(xs[i]), Y(ys[i]));
  ctx.stroke();

  ctx.fillStyle = '#aaa';
  ctx.font = '12px system-ui';
  ctx.fillText(String(Math.round(yMax)), 6, padT+12);
  ctx.fillText(String(Math.round(yMin)), 6, padT+plotH);
  ctx.fillStyle = '#666';
  ctx.fillText(`${xMax.toFixed(1)} km`, W-72, H-8);
}
